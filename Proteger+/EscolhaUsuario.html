<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha de Usuário - Proteger+</title>
  <link rel="stylesheet" href="EscolhaUsuario.css">
</head>
<body>

  <main class="container">

    <header class="header">
      <img src="logo.png" alt="Logo Proteger+" class="logo-img">
      <span class="brand-name">Proteger+</span>
    </header>

    <div class="login-badge">
      <h2>Login</h2>
    </div>

    <form class="login-form">
      
      <div class="input-group">
        <input 
          type="text" 
          placeholder="Email/telefone/ usuário:" 
          required
        >
      </div>

      <div class="input-group">
        <input 
          type="password" 
          placeholder="Senha da conta do usuário:" 
          required
        >
        <a href="#" class="forgot-password">Esqueci minha senha</a>
      </div>

      <div class="input-group">
        <input 
          type="text" 
          placeholder="Adicione seu código:"
        >
      </div>

      <button type="submit" class="btn-continuar">Continuar</button>

    </form>

  </main>

</body>
</html>
