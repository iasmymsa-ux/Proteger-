<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login Proteger+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    </head>

    <body>

        <div class="container">

            <div class="header">
                <img src="logo.png" alt="Logo Proteger+" class="logo-img">
                <div class="brand-name">Proteger+</div>
            </div>

            <div class="login-badge">
                <h2>Cadastrar</h2>
            </div>

            <form class="login-form">

                <div class="input-group">
                    <input type="text" name="email" placeholder="Email/telefone:" required>
                </div>

                <div class="input-group">
                    <input type="text" name="cuidador" placeholder="Nome do cuidador:" required>
                </div>

                <div class="input-group">
                    <input type="text" name="usuario" placeholder="Nome do usuário:" required>
                </div>

                <div class="input-group">
                    <input type="password" name="senha" placeholder="Senha da conta do usuário:" required>
                </div>

                <div class="input-group">
                    <input type="tel" name="telefone_emergencia" placeholder="Telefone de emergência:" required>
                </div>

                <div class="input-group">
                    <input type="text" name="localidade" placeholder="Localidade:" required>
                </div>

                <div class="input-group">
                    <input type="date" name="data_nascimento" required>
                </div>

                <div class="input-group">
                    <input type="text" name="codigo" placeholder="Adicione o código:" required>
                </div>

                <button type="submit" class="btn-continuar">
                    Cadastrar
                </button>

            </form>

        </div>

    </body>

</html>
