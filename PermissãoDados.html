<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permissão de Uso de Dados - Proteger+</title>
  <link rel="stylesheet" href="PermissãoDados.css">
</head>
<body>

  <main class="container">

    <header class="header">
      <img src="logo.png" alt="Logo Proteger+" class="logo-img">
      <span class="brand-name">Proteger+</span>
    </header>

    <div class="login-badge">
      <h2>Permissão de uso de dados</h2>
    </div>

    <form class="permissions-form" action="proxima_tela.html">

      <label class="checkbox-card">
        <input type="checkbox" name="dados_pessoais" checked>
        <span class="label-text">Permitir o uso de dados pessoais</span>
      </label>

      <label class="checkbox-card">
        <input type="checkbox" name="notificacoes" checked>
        <span class="label-text">Permitir notificações</span>
      </label>

      <button type="submit" class="btn-continuar">Continuar</button>

    </form>

  </main>

</body>
</html>
